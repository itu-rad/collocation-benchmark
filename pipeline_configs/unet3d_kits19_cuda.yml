# MLPerf 3D-UNet / KiTS19 medical segmentation — end-to-end (CUDA/GB10).
#
# Replaces ResNet as the accelerator workload. Three timed stages:
#   load (light) -> preprocess (resample/normalize/pad — MLPerf EXCLUDES this)
#   -> sliding-window inference (128^3 ROI, 0.5 overlap, 8-144 fwd passes; the
#   ONLY part MLPerf times). Choreo times the whole graph, which is the point:
#   the preprocessing is heavy and MLPerf's number hides it.
#
# Acquisition + GPU verification: stages/unet3d_kits19/BUILD.md. model_path and
# raw_data_dir below are the paths that doc tells you to populate.
name: "3D-UNet KiTS19 (end-to-end, CUDA)"
pipelines:
  - name: 3D-UNet KiTS19
    inputs: [0]
    outputs: [3]
    dataset_stage_id: 0
    loadgen:
      component: loadgen.OfflineLoadScheduler
      queue_depth: 8
      max_queries: 8          # smoke; raise to len(inference_cases)=42 for full
      timeout: 20000
      config:
        rate: 1
    stages:
      - name: KiTS19 case loader
        id: 0
        outputs: [1]
        component: stages.unet3d_kits19.KiTS19CaseLoader
        config:
          raw_data_dir: data/kits19/raw
          max_cases: 8

      - name: KiTS19 preprocess
        id: 1
        outputs: [2]
        component: stages.unet3d_kits19.KiTS19Preprocess
        config:
          keep_label: true

      - name: 3D-UNet sliding-window inference
        id: 2
        outputs: [3]
        component: stages.unet3d_kits19.UNet3DInference
        config:
          model_path: models/3dunet_kits19/3dunet_kits19_128x128x128.pt
          device: cuda

      - name: End stage
        id: 3
        component: stages.TerminalCapture
