# Pilot workload: CPU memory-streaming co-runner (Stage C / C3).
# Device-agnostic (pure CPU+DRAM). Serial pilot measures per-sweep service
# time -> R_max for the R-INTENSITY levels; bytes/query is deterministic
# (passes * 3 * size_mb MiB), giving the offered-GB/s axis exactly.
name: "pilot_memory_stream"
pipelines:
  - name: Memory stream pilot
    inputs: [0]
    outputs: [0]
    dataset_stage_id: 0
    loadgen:
      component: loadgen.OfflineLoadScheduler
      queue_depth: 4
      max_queries: 100
      timeout: 900
      config:
        rate: 0
    stages:
      - name: CPU memory stream
        id: 0
        component: stages.evaluation.MemoryStream
        config:
          size_mb: 256
          passes: 4
