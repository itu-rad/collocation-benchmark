# Pilot workload: plain 9B decode (HF/CUDA, GB10). BF16 counterpart of
# decode_9b_mlx.yml — same prompts, same 256-token decode.
name: "pilot_decode_9b_cuda"
pipelines:
  - name: Decode 9B pilot
    inputs: [0]
    outputs: [1]
    dataset_stage_id: 0
    loadgen:
      component: loadgen.OfflineLoadScheduler
      queue_depth: 4
      max_queries: 15
      timeout: 1800
      config:
        rate: 0
    stages:
      - name: Mock dataloader
        id: 0
        outputs: [1]
        component: stages.llm_huggingface.MockDataLoader
        config:
          tokenizer_stage_id: 1
          batch_size: 1
          shuffle: True
          split: ["train"]
          dataset:
            name: yahma/alpaca-cleaned
            system_column_name: instruction
            user_column_name: input
            assistant_column_name: output
      - name: Decode LLM
        id: 1
        component: stages.llm_huggingface.Inference
        config:
          dtype: torch.bfloat16
          device: cuda
          model:
            name: Qwen/Qwen3.5-9B
            quantize: true
            gen_kwargs:
              do_sample: false
              max_new_tokens: 256
