# Pilot workload: plain 9B decode (MLX / M2 Pro).
# Serves: E3' foreground isolation baseline + AMC GPU calibration load;
# service-time input for decode-bound knob rules.
# The pilot driver (evaluation/pilots/run_pilots.py) overrides the loadgen
# block per cell; values below are standalone-run defaults (serial).
name: "pilot_decode_9b_mlx"
pipelines:
  - name: Decode 9B pilot
    inputs: [0]
    outputs: [1]
    dataset_stage_id: 0
    loadgen:
      component: loadgen.OfflineLoadScheduler
      queue_depth: 4
      max_queries: 15
      timeout: 1800
      config:
        rate: 0
    stages:
      - name: Mock dataloader
        id: 0
        outputs: [1]
        component: stages.llm_huggingface.MockDataLoader
        config:
          tokenizer_stage_id: 1
          batch_size: 1
          shuffle: True
          split: ["train"]
          dataset:
            name: yahma/alpaca-cleaned
            system_column_name: instruction
            user_column_name: input
            assistant_column_name: output
      - name: Decode LLM
        id: 1
        component: stages.llm_mlx.Inference
        config:
          model:
            name: mlx-community/Qwen3.5-9B-OptiQ-4bit
            gen_kwargs:
              max_tokens: 256
