# §3 residency Pareto — the SERVER arm (Ollama continuous batching), CUDA/GB10.
#
# Single-diff relative to rag_serve_plain_cuda.yml: ONLY the "Generator LLM"
# stage changes (stages.llm_huggingface.Inference -> stages.llm_server.Inference
# with engine=ollama). Dataset, retriever, formatter, loadgen, terminal capture
# are byte-identical, so a throughput/latency delta vs the replicated and shared
# arms is attributable to the residency mode (one server process with dynamic
# batching) and not to a different workload.
#
# The distinguishing knob is `concurrency`: the number of requests held in
# flight against the one server, which is what lets Ollama apply continuous
# batching — the mechanism the replicated (N in-process instances, kernels
# serialize on the default stream) and shared (1 model + mutex, fully
# serialized) arms structurally cannot use.
#
# MODEL PARITY CAVEAT: the in-process arms serve Qwen/Qwen3.5-4B (bf16). The
# Ollama tag below must resolve to the SAME weights for a fair Pareto. Verify
# with `ollama pull qwen3.5:4b` (ServerManager.post_start pulls automatically);
# if the tag is absent from the Ollama library, import a GGUF built from
# Qwen/Qwen3.5-4B via a Modelfile so the served model matches. `tokenizer_name`
# pins the HF tokenizer the formatter's apply_chat_template needs (the Ollama
# tag is not an HF repo).
name: "RAG serve (residency: server/Ollama, CUDA)"
pipelines:
  - name: RAG serve server
    inputs: [0]
    outputs: [4]
    dataset_stage_id: 0
    loadgen:
      component: loadgen.PoissonLoadScheduler
      queue_depth: 100
      max_queries: 100
      timeout: 2256
      config:
        rate: 0.2243
    stages:
      - name: Question dataloader
        id: 0
        outputs: [1]
        component: stages.self_rag.SelfRAGDataLoader
        config:
          batch_size: 1
          dataset:
            name: rag-datasets/rag-mini-wikipedia
            subset: question-answer
            split: test
            question_column: question
            answers_column: answer

      - name: Document retriever
        id: 1
        outputs: [2]
        component: stages.self_rag.ChromaRetriever
        config:
          corpus_dataset:
            name: rag-datasets/rag-mini-wikipedia
            subset: text-corpus
            split: passages
            text_column: passage
            max_docs: 3200
          top_k: 3
          collection_name: rag_serve_plain_corpus_cuda

      - name: Answer formatter
        id: 2
        outputs: [3]
        component: stages.self_rag.AnswerGeneratorFormatter
        config:
          tokenizer_stage_id: 3

      - name: Generator LLM
        id: 3
        outputs: [4]
        component: stages.llm_server.Inference
        config:
          # Requests kept in flight against the one server -> continuous batching.
          concurrency: 8
          tokenizer_name: Qwen/Qwen3.5-4B
          server:
            engine: ollama
            model: qwen3.5:4b
            port: 0
          model:
            gen_kwargs:
              do_sample: false
              max_new_tokens: 128

      - name: End stage
        id: 4
        component: stages.TerminalCapture
