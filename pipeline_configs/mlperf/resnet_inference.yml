name: "ResNet50-v1.5 implementation of MLPerf Inference v5.0"
pipelines:
  - name: ResNet50-v1.5 inference
    inputs: [0]
    outputs: [2]
    dataset_stage_id: 0
    loadgen:
      # [knobs] derived by evaluation/pilots/derive_knobs.py @ 39151a976bc1fc05de803aa2c209f781bd41c933-dirty
      # [knobs] config.rate: R-LAMBDA-BELOW-SAT (0.6 x 1/0.0112s, pilot e5_resnet_serial)
      # [knobs] max_queries: R-NTIMING
      # [knobs] queue_depth: R-QDEPTH
      # [knobs] timeout: R-TIMEOUT
      # [knobs] DO NOT hand-edit; regenerate via apply_knobs.py
      component: loadgen.PoissonLoadScheduler
      queue_depth: 500
      max_queries: 500
      timeout: 47
      config:
        rate: 53.5714
    stages:
      # Dataset: Imagenette (auto-downloadable ImageNet subset). Deliberate
      # deviation from MLPerf's official ImageNet-val: E5's claim is the
      # LOAD-PATTERN reduction (arrival process + native metric), not accuracy
      # certification, and ImageNet requires a manual, non-redistributable
      # download (artifact-evaluation landmine). Samples are preloaded to
      # memory, matching MLPerf LoadGen's QSL preload semantics.
      - name: Load Imagenette samples from TorchVision Dataset
        id: 0
        outputs: [1]
        component: stages.torchvision_classification.TorchVisionDataLoader
        polling_policy: utils.queues.polling.SingleQueuePolicy
        disable_logs: false
        config:
          batch_size: 1   # one sample per query (SingleStream/Server shape)
          preprocess: False
          preload: True
          num_workers: 0
          dataset:
            component: torchvision.datasets.Imagenette
            split: [val]
      - name: Preprocess samples with ResNet50 weights transforms
        id: 1
        outputs: [2]
        component: stages.torchvision_classification.TorchVisionPreprocessFromWeights
        polling_policy: utils.queues.polling.SingleQueuePolicy
        disable_logs: false
        config:
          weights: ResNet50_Weights.IMAGENET1K_V2
      - name: ResNet50 inference
        id: 2
        outputs: []
        component: stages.torchvision_classification.TorchVisionClassification
        polling_policy: utils.queues.polling.SingleQueuePolicy
        disable_logs: false
        config:
          model:
            component: torchvision.models.resnet50
            weights: ResNet50_Weights.IMAGENET1K_V2
          device: cuda
