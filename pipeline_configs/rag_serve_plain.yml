# Plain RAG serving pipeline (no Self-RAG routing/retry loop):
#   retrieve top-3 -> format -> Qwen3.5-4B generate -> capture.
# Purposes: (a) E6' foreground candidate (light, ~seconds/query, clears the
# >=500-pooled p95 gate cheaply); (b) service-time pilot cell (e6p_fg_ragserve);
# (c) plain-RAG sanity workload. MLX / M2 Pro variant.
name: "RAG serve (plain, MLX)"
pipelines:
  - name: RAG serve plain
    inputs: [0]
    outputs: [4]
    dataset_stage_id: 0
    loadgen:
      # [knobs] derived by evaluation/pilots/derive_knobs.py @ 39151a976bc1fc05de803aa2c209f781bd41c933-dirty
      # [knobs] config.rate: R-E6-HEADROOM (0.4 x 1/1.7836s, pilot e6p_fg_ragserve)
      # [knobs] max_queries: R-NTIMING
      # [knobs] queue_depth: R-QDEPTH
      # [knobs] timeout: R-TIMEOUT
      # [knobs] DO NOT hand-edit; regenerate via apply_knobs.py
      component: loadgen.PoissonLoadScheduler
      queue_depth: 100
      max_queries: 100
      timeout: 2256
      config:
        rate: 0.2243
    stages:
      - name: Question dataloader
        id: 0
        outputs: [1]
        component: stages.self_rag.SelfRAGDataLoader
        config:
          batch_size: 1
          dataset:
            name: rag-datasets/rag-mini-wikipedia
            subset: question-answer
            split: test
            question_column: question
            answers_column: answer

      - name: Document retriever
        id: 1
        outputs: [2]
        component: stages.self_rag.ChromaRetriever
        config:
          corpus_dataset:
            name: rag-datasets/rag-mini-wikipedia
            subset: text-corpus
            split: passages
            text_column: passage
            max_docs: 3200
          top_k: 3
          collection_name: rag_serve_plain_corpus

      - name: Answer formatter
        id: 2
        outputs: [3]
        component: stages.self_rag.AnswerGeneratorFormatter
        config:
          tokenizer_stage_id: 3

      - name: Generator LLM
        id: 3
        outputs: [4]
        component: stages.llm_mlx.Inference
        config:
          model:
            name: mlx-community/Qwen3.5-4B-OptiQ-4bit
            gen_kwargs:
              max_tokens: 128

      - name: End stage
        id: 4
        component: stages.TerminalCapture
