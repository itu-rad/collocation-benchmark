# Multi-scale modularity-overhead sweep manifest (E2 expansion).
#
# The single published E2 point (EfficientNetV2-S @ batch 8) is the *worst
# realistic case*: a small, fast step where Choreo's roughly FIXED per-step cost
# (queue push/pop + thread handoff for the core wrapper; one async span for
# tracing) is the largest fraction of the step. These cells make the step heavier
# along two crossing 1-D axes so the RELATIVE overhead collapses toward zero:
#
#   * batch sweep   @ efficientnet_v2_s : batch 1..64   (b8 is the shared anchor)
#   * model  sweep  @ batch 8           : s -> m -> l -> convnext_large
#
# Deliberately NOT a full model x batch grid: big-model x big-batch would OOM the
# 16 GB M2, and the two 1-D sweeps already span ~1-2 orders of magnitude of
# step-time, which is all the amortization curve needs.
#
# For each cell the bare baseline and the wrapped Choreo arm run the IDENTICAL
# workload (same model, weights/resolution, head, batch) — the single source of
# truth is the (model, weights, batch) triple here, fed to both arms.
#
# max_batches is UNIFORM at 1000 across all cells so every cell has the same
# steady-state N (1000 - 200 warmup = 800 steps/run) — equal-weight cells for the
# per-run and within-run variability analysis. The epoch-loop in both arms reaches
# 1000 regardless of batch size (large batches loop the small Imagenette split).
#
# Usage:
#   python run_modularity.py --device mps  --cells configs/scale_sweep.yml
#   python run_modularity.py --device cuda --cells configs/scale_sweep.yml

cells:
  # --- batch sweep @ EfficientNetV2-S (b8 = shared anchor, also the model-sweep S) ---
  - {tag: effv2s, model: efficientnet_v2_s, weights: EfficientNet_V2_S_Weights.IMAGENET1K_V1, batch: 1,  max_batches: 1000}
  - {tag: effv2s, model: efficientnet_v2_s, weights: EfficientNet_V2_S_Weights.IMAGENET1K_V1, batch: 2,  max_batches: 1000}
  - {tag: effv2s, model: efficientnet_v2_s, weights: EfficientNet_V2_S_Weights.IMAGENET1K_V1, batch: 4,  max_batches: 1000}
  - {tag: effv2s, model: efficientnet_v2_s, weights: EfficientNet_V2_S_Weights.IMAGENET1K_V1, batch: 8,  max_batches: 1000}
  - {tag: effv2s, model: efficientnet_v2_s, weights: EfficientNet_V2_S_Weights.IMAGENET1K_V1, batch: 16, max_batches: 1000}
  - {tag: effv2s, model: efficientnet_v2_s, weights: EfficientNet_V2_S_Weights.IMAGENET1K_V1, batch: 32, max_batches: 1000}
  - {tag: effv2s, model: efficientnet_v2_s, weights: EfficientNet_V2_S_Weights.IMAGENET1K_V1, batch: 64, max_batches: 1000}

  # --- model sweep @ batch 8 (efficientnet_v2_s covered by the anchor above) ---
  - {tag: effv2m,    model: efficientnet_v2_m, weights: EfficientNet_V2_M_Weights.IMAGENET1K_V1, batch: 8, max_batches: 1000}
  - {tag: effv2l,    model: efficientnet_v2_l, weights: EfficientNet_V2_L_Weights.IMAGENET1K_V1, batch: 8, max_batches: 1000}
  - {tag: convnextl, model: convnext_large,    weights: ConvNeXt_Large_Weights.IMAGENET1K_V1,    batch: 8, max_batches: 1000}
