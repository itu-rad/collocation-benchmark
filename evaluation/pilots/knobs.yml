experiments:
  e1:
    any:
    - knob: R
      value: 10
      rule: R-REPS
      scope: driver
      verified: null
    - knob: warmup_k
      value: 22
      rule: R-WARMUP
      scope: analysis
      verified: null
      inputs:
        csvs_scanned: 5
        converged_runs: 3
        k_star_max: 11
        k_fixed: 22
        window: 5
        epsilon: 0.1
      note: replaces the old 1-of-101 drop
    - knob: loadgen.max_queries
      value: 122
      rule: R-NTIMING
      scope: driver
      verified: null
      note: 100 measured queries after warm-up
  e2:
    any:
    - knob: R
      value: 10
      rule: R-REPS
      scope: driver
      verified: null
    - knob: max_batches
      value: 1100
      rule: R-NTIMING
      scope: driver
      verified: null
      note: one continuous epoch; canonicalizes the 400/1100 driver default split
    - knob: warmup_k
      value: 200
      rule: R-WARMUP
      scope: analysis
      verified: null
      inputs:
        csvs_scanned: 10
        converged_runs: 9
        k_star_max: 0
        k_fixed: 1
        window: 51
        epsilon: 0.05
      note: canonical 200 unless detector demands more (detected on tracing-ON runs; tracing-OFF runs
        1-2 are contaminated and excluded)
  e4:
    gb10:
    - knob: loadgen.config.rate
      value: 0.1541
      rule: R-LAMBDA-BELOW-SAT
      scope: config
      verified: null
      inputs:
        pilot: e4_factoid_mono9b
        median_service_s: 3.893
