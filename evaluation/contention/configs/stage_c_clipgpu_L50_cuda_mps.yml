name: stage_c_clipgpu_L50_cuda_mps
pipelines:
- name: RAG serve plain
  inputs:
  - 0
  outputs:
  - 4
  dataset_stage_id: 0
  loadgen:
    component: loadgen.PoissonLoadScheduler
    queue_depth: 100
    max_queries: 100
    timeout: 2256
    config:
      rate: 0.2243
  stages:
  - name: Question dataloader
    id: 0
    outputs:
    - 1
    component: stages.self_rag.SelfRAGDataLoader
    config:
      batch_size: 1
      dataset:
        name: rag-datasets/rag-mini-wikipedia
        subset: question-answer
        split: test
        question_column: question
        answers_column: answer
  - name: Document retriever
    id: 1
    outputs:
    - 2
    component: stages.self_rag.ChromaRetriever
    config:
      corpus_dataset:
        name: rag-datasets/rag-mini-wikipedia
        subset: text-corpus
        split: passages
        text_column: passage
        max_docs: 3200
      top_k: 3
      collection_name: rag_serve_plain_corpus_cuda
  - name: Answer formatter
    id: 2
    outputs:
    - 3
    component: stages.self_rag.AnswerGeneratorFormatter
    config:
      tokenizer_stage_id: 3
  - name: Generator LLM
    id: 3
    outputs:
    - 4
    component: stages.llm_huggingface.Inference
    config:
      dtype: torch.bfloat16
      device: cuda
      model:
        name: Qwen/Qwen3.5-4B
        quantize: false
        gen_kwargs:
          do_sample: false
          max_new_tokens: 128
  - name: End stage
    id: 4
    component: stages.TerminalCapture
- name: BG co-runner clipgpu
  dataset_stage_id: 0
  inputs:
  - 0
  outputs:
  - 1
  loadgen:
    component: loadgen.MultiStreamScheduler
    queue_depth: 1000
    max_queries: 9393
    timeout: 1337
    config:
      interval: 0.0712
  stages:
  - name: VQA dataloader
    id: 0
    outputs:
    - 1
    component: stages.multimodal_vqa.VQADataLoader
    config:
      dataset:
        name: Multimodal-Fatima/OK-VQA_train
        split: train
        image_column: image
        question_column: question
        answers_column: answers
        max_samples: 100
      batch_size: 1
  - name: CLIP vision encoder
    id: 1
    component: stages.multimodal_vqa.CLIPVisionEncoder
    config:
      model:
        name: openai/clip-vit-large-patch14
      device: cuda
listeners:
- dcgmi
- top
collocation: mps
