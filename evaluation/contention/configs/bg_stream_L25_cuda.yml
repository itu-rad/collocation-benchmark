name: bg_stream_L25_cuda
pipelines:
- name: BG co-runner stream
  dataset_stage_id: 0
  inputs:
  - 0
  outputs:
  - 0
  loadgen:
    component: loadgen.MultiStreamScheduler
    queue_depth: 1000
    max_queries: 1000
    timeout: 3600
    config:
      interval: 0.41085
  stages:
  - name: CPU memory stream
    id: 0
    component: stages.evaluation.MemoryStream
    config:
      size_mb: 256
      passes: 4
