name: stage_a_B2_mlx
pipelines:
- name: RAG serve plain
  inputs:
  - 0
  outputs:
  - 4
  dataset_stage_id: 0
  loadgen:
    component: loadgen.PoissonLoadScheduler
    queue_depth: 100
    max_queries: 80
    timeout: 2256
    config:
      rate: 0.1
  stages:
  - name: Question dataloader
    id: 0
    outputs:
    - 1
    component: stages.self_rag.SelfRAGDataLoader
    config:
      batch_size: 1
      dataset:
        name: rag-datasets/rag-mini-wikipedia
        subset: question-answer
        split: test
        question_column: question
        answers_column: answer
  - name: Document retriever
    id: 1
    outputs:
    - 2
    component: stages.self_rag.ChromaRetriever
    config:
      corpus_dataset:
        name: rag-datasets/rag-mini-wikipedia
        subset: text-corpus
        split: passages
        text_column: passage
        max_docs: 3200
      top_k: 3
      collection_name: rag_serve_plain_corpus
  - name: Answer formatter
    id: 2
    outputs:
    - 3
    component: stages.self_rag.AnswerGeneratorFormatter
    config:
      tokenizer_stage_id: 3
  - name: Generator LLM
    id: 3
    outputs:
    - 4
    component: stages.llm_mlx.Inference
    config:
      model:
        name: mlx-community/Qwen3.5-4B-OptiQ-4bit
        gen_kwargs:
          max_tokens: 128
  - name: End stage
    id: 4
    component: stages.TerminalCapture
- name: BG indexer 0
  inputs:
  - 0
  outputs:
  - 2
  dataset_stage_id: 0
  loadgen:
    component: loadgen.SaturatingOfflineScheduler
    queue_depth: 100
    max_queries: 100
    timeout: 3600
    config:
      rate: 0
  stages:
  - name: Corpus chunk loader (shard 0/2)
    id: 0
    outputs:
    - 1
    component: stages.rag_indexing.CorpusChunkLoader
    config:
      dataset:
        name: rag-datasets/rag-mini-wikipedia
        subset: text-corpus
        split: passages
        text_column: passage
      docs_per_query: 32
      shard:
        index: 0
        count: 2
  - name: Embed passages
    id: 1
    outputs:
    - 2
    component: stages.rag_indexing.EmbedStage
    config:
      model:
        name: sentence-transformers/all-MiniLM-L6-v2
      device: mps
      max_length: 256
  - name: Chroma indexer
    id: 2
    component: stages.rag_indexing.ChromaIndexer
    config:
      collection_name: bg_index_shard0
- name: BG indexer 1
  inputs:
  - 0
  outputs:
  - 2
  dataset_stage_id: 0
  loadgen:
    component: loadgen.SaturatingOfflineScheduler
    queue_depth: 100
    max_queries: 100
    timeout: 3600
    config:
      rate: 0
  stages:
  - name: Corpus chunk loader (shard 1/2)
    id: 0
    outputs:
    - 1
    component: stages.rag_indexing.CorpusChunkLoader
    config:
      dataset:
        name: rag-datasets/rag-mini-wikipedia
        subset: text-corpus
        split: passages
        text_column: passage
      docs_per_query: 32
      shard:
        index: 1
        count: 2
  - name: Embed passages
    id: 1
    outputs:
    - 2
    component: stages.rag_indexing.EmbedStage
    config:
      model:
        name: sentence-transformers/all-MiniLM-L6-v2
      device: mps
      max_length: 256
  - name: Chroma indexer
    id: 2
    component: stages.rag_indexing.ChromaIndexer
    config:
      collection_name: bg_index_shard1
listeners:
- macmon
