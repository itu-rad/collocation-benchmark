# E3 prong 1: a VALID SingleStream reference run.
#
# Two things have to be right, and only the first was obvious.
#
# 1. No max_query_count cap. user_e3.conf capped it at 43 -- the size of the
#    QSL -- and loadgen needs more than that to clear early stopping, so it
#    reported "Result is : INVALID".
#
# 2. A REALISTIC target_latency. min_query_count is a FLOOR, not a cap:
#    loadgen computes effective_min_query_count from min_duration divided by
#    the expected per-query latency, and takes the larger of that and the
#    floor. With no target_latency set it assumes a tiny query and demands
#    enough of them to fill 600 s -- on 2026-09-02 that came out as
#    effective_min_query_count = 120013, and the run was still going 8.5 hours
#    and 4087 queries later with a 1.8 GB trace file.
#
#    3D-UNet on KiTS19 runs 1-19 s per case on GB10, ~7.5 s typical, so 8000 ms
#    gives 600000/8000 = 75 queries: past the early-stopping threshold, and
#    about 10 minutes of wall clock.
*.SingleStream.target_latency = 8000
*.SingleStream.min_duration = 600000
*.SingleStream.min_query_count = 64
