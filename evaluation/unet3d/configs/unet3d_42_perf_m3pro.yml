# E3 — MLPerf 3D-UNet / KiTS19, 42-case online serving.
#
# PERFORMANCE config: three stages, and NOTHING is written per query.
#
# TWO PASSES over the 42-case list (max_queries: 84). The first pass is warm-up
# and is dropped at analysis; the loader cycles, so queries 42-83 cover every
# case exactly once, all measured on a warm device. This is not belt-and-braces:
# a single-pass collection on gb10 ran its first four queries 60-82% above
# steady state, which put a +82% outlier into the parity comparison. m3pro shows
# no such transient, but the config is uniform so the method does not depend on
# which device it lands on.
# `disable_logs` is set on the pipeline and on every stage, so all timing
# comes from spans. TerminalCapture is deliberately absent -- it repr()s a
# multi-MB numpy segmentation per query, and that serialisation would sit
# inside the measured pipeline. Inference is therefore the pipeline's exit
# stage, so the payload-release rule frees the segmentation on its thread.
#
# Generated shape, kept in the repo rather than generated at collection time:
# there are only four of these and they are read by reviewers, not swept.
name: E3 3D-UNet KiTS19 42-case online, perf (m3pro)
pipelines:
- name: 3D-UNet KiTS19
  inputs:
  - 0
  outputs:
  - 2
  dataset_stage_id: 0
  loadgen:
    component: loadgen.OfflineLoadScheduler
    queue_depth: 1
    max_queries: 84
    timeout: 1800000
    config:
      rate: 1
  disable_logs: true
  stages:
  - name: KiTS19 case loader
    id: 0
    outputs:
    - 1
    component: stages.unet3d_kits19.KiTS19CaseLoader
    disable_logs: true
    config:
      raw_data_dir: data/kits19/raw
      cases_json: evaluation/unet3d/inference_cases.json
  - name: KiTS19 preprocess
    id: 1
    outputs:
    - 2
    component: stages.unet3d_kits19.KiTS19Preprocess
    disable_logs: true
    config:
      keep_label: false
  - name: 3D-UNet sliding-window inference
    id: 2
    outputs: []
    component: stages.unet3d_kits19.UNet3DInference
    disable_logs: true
    config:
      model_path: models/3dunet_kits19/3dunet_kits19_pytorch.ptc
      device: mps
  serialize_queries: true
listeners: []
